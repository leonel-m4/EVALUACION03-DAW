<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Tres microservicios con bases independientes y consultas HTTP por ID">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect width="960" height="470" fill="#f8fafc"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="480" y="32" font-size="22" font-weight="bold">Soporte técnico — Laboratorio 17</text>
    <rect x="390" y="54" width="180" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="480" y="82" font-size="18">Postman / API REST</text>
    <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M440 98 L160 165"/><path d="M480 98 L480 165"/><path d="M520 98 L800 165"/>
      <path d="M160 240 L160 345"/><path d="M480 240 L480 345"/><path d="M800 240 L800 345"/>
      <path d="M720 240 L720 292 L190 292 L190 240" stroke-dasharray="6,5"/>
      <path d="M680 292 L510 292 L510 240" stroke-dasharray="6,5"/>
    </g>
    <g fill="#dbeafe" stroke="#2563eb">
      <rect x="50" y="165" width="220" height="75" rx="10"/>
      <rect x="370" y="165" width="220" height="75" rx="10"/>
      <rect x="690" y="165" width="220" height="75" rx="10"/>
    </g>
    <g font-size="18" font-weight="bold">
      <text x="160" y="195">Usuario Service</text><text x="480" y="195">Técnico Service</text><text x="800" y="195">Ticket Service</text>
    </g>
    <g font-size="15"><text x="160" y="220">8081 · CRUD usuarios</text><text x="480" y="220">8082 · CRUD técnicos</text><text x="800" y="220">8083 · tickets y estados</text></g>
    <rect x="300" y="277" width="345" height="26" fill="#f8fafc"/>
    <text x="472" y="296" font-size="14">Ticket comprueba IDs por HTTP (POST/PUT)</text>
    <g fill="#dcfce7" stroke="#16a34a">
      <rect x="50" y="345" width="220" height="65" rx="18"/>
      <rect x="370" y="345" width="220" height="65" rx="18"/>
      <rect x="690" y="345" width="220" height="65" rx="18"/>
    </g>
    <g font-size="18"><text x="160" y="374">bd_usuario</text><text x="480" y="374">bd_tecnico</text><text x="800" y="374">bd_ticket</text></g>
    <g font-size="14"><text x="160" y="395">tabla usuarios</text><text x="480" y="395">tabla tecnicos</text><text x="800" y="395">tabla tickets</text></g>
    <text x="480" y="449" font-size="15">MySQL local · bases y credenciales separadas · sin tablas compartidas</text>
  </g>
</svg>
