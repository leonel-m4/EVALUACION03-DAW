server:
  port: ${TICKET_PORT:8083}
spring:
  application:
    name: ticket-service
  profiles:
    default: dev
  jpa:
    open-in-view: false
    database-platform: ${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
